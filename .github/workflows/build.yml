name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: clamav
      folders: |
        1.2
        1.4
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        clamav${FOLDER}
        clamav${FOLDER}-${VERSION_MAJOR}
        clamav${FOLDER}-${VERSION_MINOR}
        clamav${FOLDER}-${VERSION}
        clamav${CLAMAV_REVISION}
      default-folder: "1.4"
      default-tags: |
        latest
        ${VERSION_MAJOR}
        ${VERSION_MINOR}
        ${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
